  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0fdf4;font-family:Inter,sans-serif;">
        <svg viewBox="0 0 280 140" width="280" height="140" style="margin-bottom:20px;">
          <!-- ground -->
          <rect x="0" y="120" width="280" height="20" rx="4" fill="#dcfce7"/>
          <rect x="0" y="122" width="280" height="2" fill="#bbf7d0"/>

          <!-- solar panel 1 — fades in first -->
          <g style="animation:buildUp .6s ease-out .2s both;">
            <rect x="20" y="96" width="3" height="24" fill="#9ca3af" rx="1"/>
            <rect x="8" y="86" width="28" height="14" rx="2" fill="#1e3a5f" transform="rotate(-20,22,93)"/>
            <rect x="8" y="86" width="28" height="14" rx="2" fill="url(#ls)" transform="rotate(-20,22,93)"/>
          </g>
          <!-- solar panel 2 -->
          <g style="animation:buildUp .6s ease-out .5s both;">
            <rect x="55" y="96" width="3" height="24" fill="#9ca3af" rx="1"/>
            <rect x="43" y="86" width="28" height="14" rx="2" fill="#1e3a5f" transform="rotate(-20,57,93)"/>
          </g>
          <!-- solar panel 3 -->
          <g style="animation:buildUp .6s ease-out .8s both;">
            <rect x="90" y="96" width="3" height="24" fill="#9ca3af" rx="1"/>
            <rect x="78" y="86" width="28" height="14" rx="2" fill="#1e3a5f" transform="rotate(-20,92,93)"/>
          </g>

          <!-- wind turbine tower — builds up -->
          <g style="animation:buildUp .6s ease-out 1.1s both;">
            <rect x="158" y="40" width="4" height="80" fill="#94a3b8" rx="1"/>
            <circle cx="160" cy="40" r="4" fill="#cbd5e1"/>
          </g>
          <!-- wind turbine blades — spin after appearing -->
          <g style="animation:buildUp .5s ease-out 1.5s both;">
            <g style="transform-origin:160px 40px;animation:spin 3s linear 2s infinite;">
              <rect x="157" y="10" width="6" height="30" rx="3" fill="#16a34a" opacity="0.85"/>
              <rect x="157" y="10" width="6" height="30" rx="3" fill="#16a34a" opacity="0.85" transform="rotate(120,160,40)"/>
              <rect x="157" y="10" width="6" height="30" rx="3" fill="#16a34a" opacity="0.85" transform="rotate(240,160,40)"/>
            </g>
          </g>

          <!-- battery/building — last piece -->
          <g style="animation:buildUp .6s ease-out 1.8s both;">
            <rect x="220" y="90" width="36" height="30" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
            <rect x="226" y="96" width="10" height="8" rx="1" fill="#16a34a" opacity="0.6"/>
            <rect x="240" y="96" width="10" height="8" rx="1" fill="#16a34a" opacity="0.4"/>
            <rect x="226" y="108" width="10" height="8" rx="1" fill="#16a34a" opacity="0.3"/>
            <rect x="240" y="108" width="10" height="8" rx="1" fill="#16a34a" opacity="0.5">
              <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
            </rect>
          </g>

          <!-- sun glow — appears last -->
          <g style="animation:buildUp .8s ease-out 2.2s both;">
            <circle cx="250" cy="20" r="12" fill="#fbbf24" opacity="0.8"/>
            <circle cx="250" cy="20" r="18" fill="#fbbf24" opacity="0.12">
              <animate attributeName="r" values="18;22;18" dur="3s" repeatCount="indefinite"/>
            </circle>
          </g>

          <!-- connection lines — power flowing -->
          <g style="animation:buildUp .5s ease-out 2.5s both;">
            <line x1="105" y1="110" x2="155" y2="110" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3" opacity="0.5">
              <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
            </line>
            <line x1="165" y1="110" x2="218" y2="110" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3" opacity="0.5">
              <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
            </line>
          </g>

          <defs>
            <linearGradient id="ls" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
        </svg>

        <img src="/emergent-leaf.png" alt="Emergent Energy" style="width:36px;height:36px;object-fit:contain;margin-bottom:12px;animation:pulse 2s ease-in-out infinite;" />
        <p style="color:#16a34a;font-weight:600;font-size:14px;margin:0 0 4px;letter-spacing:0.3px;">Building your site</p>
        <div style="width:120px;height:3px;background:#e2e8f0;border-radius:4px;margin-top:10px;overflow:hidden;">
          <div style="width:40%;height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);border-radius:4px;animation:charge 1.5s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes buildUp {
          from { opacity:0; transform:translateY(12px); }
          to { opacity:1; transform:translateY(0); }
        }
        @keyframes spin {
          to { transform:rotate(360deg); }
        }
        @keyframes pulse {
          0%,100% { opacity:1; transform:scale(1); }
          50% { opacity:0.7; transform:scale(1.04); }
        }
        @keyframes charge {
          0% { transform:translateX(-100%); }
          50% { transform:translateX(150%); }
          100% { transform:translateX(300%); }
        }
      </style>
    </div>
  </body>
</html>
