name: Nightly Prod → Dev Sync

# A6 (audit closeout): nightly job that wipes the DEV database and replaces
# it with a verbatim copy of PROD. See:
#   - scripts/sync-prod-to-dev.ts        (the script with safety guards)
#   - docs/runbooks/dev-data-refresh.md  (operator procedure + secrets setup)

on:
  schedule:
    # 02:00 UTC = 04:00 SAST every day. Off-peak for South Africa.
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows operators to trigger the sync manually from the Actions tab.

# Only one sync may run at a time; if a new run starts while a previous one
# is still going, cancel the older one.
concurrency:
  group: nightly-prod-to-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Dump prod and restore into dev
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PostgreSQL 16 client (matching server version)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          psql --version

      - name: Install npm dependencies
        run: npm ci

      - name: Run prod → dev sync
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: npx tsx scripts/sync-prod-to-dev.ts
