name: Nightly Prod → Dev Sync

# A6 (audit closeout): nightly job that wipes the DEV database and replaces
# it with a verbatim copy of PROD. See:
#   - scripts/sync-prod-to-dev.ts        (the script with safety guards)
#   - docs/runbooks/dev-data-refresh.md  (operator procedure + secrets setup)

on:
  schedule:
    # 02:00 UTC = 04:00 SAST every day. Off-peak for South Africa.
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows operators to trigger the sync manually from the Actions tab.

# Only one sync may run at a time; if a new run starts while a previous one
# is still going, cancel the older one.
concurrency:
  group: nightly-prod-to-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Dump prod and restore into dev
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight required secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PROD_DATABASE_URL:-}" ]; then
            echo "::error::Missing required secret: PROD_DATABASE_URL"
            missing=1
          fi
          if [ -z "${DEV_DATABASE_URL:-}" ]; then
            echo "::error::Missing required secret: DEV_DATABASE_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          pg_dump --version
          psql --version

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run prod → dev sync
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: npx tsx scripts/sync-prod-to-dev.ts
