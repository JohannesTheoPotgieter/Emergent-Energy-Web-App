name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Stage 1: Compile integrity (no DB required) ───────────
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      # Turbo task cache — keyed by lockfile + turbo config, restored from
      # any prior run on this branch (or main if that's all that's available).
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            .eslintcache
          key: turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-compile-${{ runner.os }}-
      - run: npx turbo run lint check build

  # ── Stage 2: Tests (requires Postgres) ────────────────────
  test:
    runs-on: ubuntu-latest
    needs: compile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/emergent_test
      TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_SECRET: ci-test-jwt-secret
      SESSION_SECRET: ci-test-session-secret

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            .eslintcache
          key: turbo-test-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-test-${{ runner.os }}-
            turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
      - run: npx turbo run build test
        if: hashFiles('**/*.test.ts') != ''
      # Non-cacheable integration steps (need a live server + DB)
      - run: npm run test:api
      - run: npm run release:gate
        env:
          SKIP_SMOKE_TESTS: "true"
