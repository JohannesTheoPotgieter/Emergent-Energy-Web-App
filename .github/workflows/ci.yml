name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Compile Integrity (fast, no DB needed)
  # ──────────────────────────────────────────────────────────────
  compile-integrity:
    name: Compile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Architecture Contracts (unit tests that validate
  #           policy adoption, route integrity, permission matrix)
  # ──────────────────────────────────────────────────────────────
  architecture-contracts:
    name: Architecture Contracts
    runs-on: ubuntu-latest
    needs: compile-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
        if: hashFiles('**/*.test.ts') != ''

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Behaviour Tests (API tests, requires DB)
  # ──────────────────────────────────────────────────────────────
  behaviour-tests:
    name: Behaviour Tests
    runs-on: ubuntu-latest
    needs: compile-integrity
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/emergent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:api

  # ──────────────────────────────────────────────────────────────
  # Stage 4: Release Gate (final quality gate)
  # ──────────────────────────────────────────────────────────────
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [architecture-contracts, behaviour-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/emergent_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run release:gate
