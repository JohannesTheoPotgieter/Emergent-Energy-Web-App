name: PR Checks
on:
  pull_request:
    branches: [main]

jobs:
  # ── Fast gate: compile integrity (no DB required) ─────────
  # Uses local Turbo cache only. Remote cache was intentionally removed as a
  # correctness gate — secrets that might not be configured must not be
  # load-bearing for "did my code compile".
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            .eslintcache
          key: turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-compile-${{ runner.os }}-
      - run: npm run ci:compile
      # Schema-drift guard (Phase 3b). Fails the build if shared/schema/*.ts
      # was edited without a corresponding new migration under /migrations/.
      - run: npm run db:check
      # Agent-docs freshness gate (Plan v3 § 2.8 / D.9). Fails the build if
      # docs/AGENT_GUARDRAILS.md `Last verified` is older than 90 days, the
      # CLAUDE.md role-count claim doesn't match COMPANY_ROLES, or the § 3.1
      # snapshot-table list drifts from shared/schema/*.ts.
      - run: npm run check:agent-docs
      # Unit tests (Phase 4). No Postgres, no live server — pure vitest over
      # qa/tests/unit/. Any regression in finance math, error-leak guards,
      # schema invariants, or other pinned contracts fails PRs here.
      - run: npm run test

  # ── Quality gate: tests + release readiness ───────────────
  quality-gate:
    runs-on: ubuntu-latest
    needs: compile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/emergent_test
      TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_SECRET: ci-test-jwt-secret
      SESSION_SECRET: ci-test-session-secret
      # Auto-create the connect-pg-simple `session` table at boot so the
      # password-login flow can persist a session in CI.
      ENABLE_STARTUP_SCHEMA_REPAIR: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      # Provision the test database BEFORE the turbo run so DB-gated unit
      # tests (e.g. qa/tests/unit/v2-finance-cashflow-db.test.ts) have a
      # real schema in `beforeAll`. The cache restore on main can mask
      # the missing-schema bug for unchanged-input commits, so any PR
      # that invalidates the cache used to fail at `npx turbo run test`.
      # Push the schema, seed the test users, then let turbo run.
      - run: npm run db:push
      # Column-level proof that the pushed schema matches shared/schema —
      # also exercises the verifier the release gate re-runs below.
      - run: npm run db:verify-schema
      - run: npm run seed:test-users
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            .eslintcache
          key: turbo-test-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-test-${{ runner.os }}-
            turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
      - run: npx turbo run build test --cache-dir=.turbo
        if: hashFiles('**/*.test.ts') != ''
      # Non-cacheable integration steps (need a live server + DB)
      - run: npm run test:api
      # release:gate runs 2 Playwright admin-roles specs when SKIP_SMOKE_TESTS=true
      # (it swaps the full smoke suite for these two). Install the browser + OS
      # deps so they don't error on a missing chromium executable.
      - run: npx playwright install --with-deps chromium
      - run: npm run reconciliation:report
      - run: npm run release:gate
        env:
          SKIP_SMOKE_TESTS: "true"

  # ── Migration integrity: the DEPLOY path, proven end-to-end ───────────
  # Replit deploys with `npm run build && npm run db:migrate` — but the
  # quality-gate provisions its DB with db:push, so the migrate path was
  # never exercised in CI. That blind spot is how "ledger says applied,
  # columns missing" shipped twice (0071; 0090–0096). This job proves on
  # every PR that:
  #   1. migrate-from-ZERO yields exactly the shared/schema column set, and
  #   2. an already-migrated DB that has drifted (simulated 0071 incident)
  #      CONVERGES on the next `npm run db:migrate`.
  migration-integrity:
    runs-on: ubuntu-latest
    needs: compile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emergent_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/emergent_migrate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      # Fresh DB → full migrate-from-zero (drizzle-bootstrap + drizzle-kit).
      - name: Migrate from zero
        run: npm run db:migrate
      - name: Verify fresh schema (column level)
        run: npm run db:verify-schema
      # Simulate the 0071 incident: drop migrated columns + table while the
      # ledger still records the migrations as applied.
      - name: Simulate ledger-vs-schema drift
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE change_requests DROP COLUMN submitted_by_user_id, DROP COLUMN approver_user_id, DROP COLUMN rejected_at;' \
            -c 'DROP TABLE post_handover_reviews;'
          if npm run db:verify-schema; then
            echo "::error::db:verify-schema failed to detect simulated drift" && exit 1
          fi
      # An already-migrated (drifted) DB must CONVERGE on the next migrate:
      # the drizzle-bootstrap canary detects the missing artifacts and
      # replays the repair migration.
      - name: Re-migrate drifted DB and verify convergence
        run: |
          npm run db:migrate
          npm run db:verify-schema
