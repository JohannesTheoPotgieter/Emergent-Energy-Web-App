name: PR Checks
on:
  pull_request:
    branches: [main, develop]

jobs:
  # ── Fast gate: compile integrity (no DB required) ─────────
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  # ── Quality gate: tests + release readiness ───────────────
  quality-gate:
    runs-on: ubuntu-latest
    needs: compile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/emergent_test
      TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_SECRET: ci-test-jwt-secret
      SESSION_SECRET: ci-test-session-secret

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
        if: hashFiles('**/*.test.ts') != ''
      - run: npm run release:gate
        env:
          SKIP_SMOKE_TESTS: "true"
