name: PR Checks
on:
  pull_request:
    branches: [main]

jobs:
  # ── Compile + unit gate (no DB required) ──────────────────
  # The single per-PR gate. Uses local Turbo cache only. Remote cache was
  # intentionally removed as a correctness gate — secrets that might not be
  # configured must not be load-bearing for "did my code compile".
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            .eslintcache
          key: turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-compile-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-compile-${{ runner.os }}-
      - run: npm run ci:compile
      # Schema-drift guard. Fails the build if shared/schema/*.ts was edited
      # without a corresponding new migration under /migrations/.
      - run: npm run db:check
      # Agent-docs freshness gate. Fails the build if docs/AGENT_GUARDRAILS.md
      # `Last verified` is older than 90 days, the CLAUDE.md role-count claim
      # doesn't match COMPANY_ROLES, or the § 3.1 snapshot-table list drifts
      # from shared/schema/*.ts.
      - run: npm run check:agent-docs
      # Unit tests. No Postgres, no live server — pure vitest over
      # qa/tests/unit/. Any regression in finance math, error-leak guards,
      # schema invariants, or other pinned contracts fails PRs here.
      - run: npm run test
